<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madalux — Controle Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen bg-[#101C2C] text-slate-100 antialiased selection:bg-[#D4B16A]/30 selection:text-white">

  <!-- ==================== TELA DE AUTENTICAÇÃO ==================== -->
  <section id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#202B3A] border border-[#D4B16A]/35 rounded-2xl p-7 shadow-2xl">
      <div class="text-center mb-6">
        <span class="inline-block text-[11px] uppercase tracking-[0.24em] text-[#D4B16A] mb-1">
          Gestão Patrimonial & Familiar
        </span>
        <h1 class="text-2xl font-bold tracking-wide text-white">Madalux</h1>
      </div>

      <!-- Abas Login / Cadastro -->
      <div class="grid grid-cols-2 gap-1.5 bg-[#101C2C] p-1 rounded-xl mb-5 border border-slate-800">
        <button id="tab-login" type="button" onclick="setAuthTab('login')"
          class="py-2 rounded-lg text-sm font-semibold bg-[#087F5B] text-white transition cursor-pointer">
          Entrar
        </button>
        <button id="tab-register" type="button" onclick="setAuthTab('register')"
          class="py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition cursor-pointer">
          Criar Conta
        </button>
      </div>

      <!-- Feedback -->
      <div id="auth-feedback" class="hidden mb-4 p-3 rounded-xl text-xs leading-relaxed"></div>

      <!-- Form Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs text-slate-400 mb-1">E-mail</label>
          <input id="login-email" type="email" required autocomplete="email"
            placeholder="seuemail@exemplo.com"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#101C2C] border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#D4B16A]" />
        </div>

        <div>
          <label for="login-pass" class="block text-xs text-slate-400 mb-1">Senha</label>
          <input id="login-pass" type="password" required autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#101C2C] border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#D4B16A]" />
        </div>

        <button id="btn-login" type="submit"
          class="w-full py-2.5 rounded-xl bg-[#087F5B] hover:bg-[#099268] text-white text-sm font-semibold transition cursor-pointer">
          Acessar Madalux
        </button>
      </form>

      <!-- Form Cadastro -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="reg-name" class="block text-xs text-slate-400 mb-1">Nome Completo</label>
          <input id="reg-name" type="text" required
            placeholder="Seu nome completo"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#101C2C] border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#D4B16A]" />
        </div>

        <div>
          <label for="reg-email" class="block text-xs text-slate-400 mb-1">E-mail</label>
          <input id="reg-email" type="email" required autocomplete="email"
            placeholder="seuemail@exemplo.com"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#101C2C] border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#D4B16A]" />
        </div>

        <div>
          <label for="reg-pass" class="block text-xs text-slate-400 mb-1">Senha (mín. 6 caracteres)</label>
          <input id="reg-pass" type="password" minlength="6" required autocomplete="new-password"
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#101C2C] border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#D4B16A]" />
        </div>

        <button id="btn-register" type="submit"
          class="w-full py-2.5 rounded-xl bg-[#D4B16A] hover:bg-[#c6a258] text-[#101C2C] text-sm font-semibold transition cursor-pointer">
          Enviar Solicitação
        </button>
      </form>
    </div>
  </section>

  <!-- ==================== APLICAÇÃO PRINCIPAL ==================== -->
  <section id="app-view" class="hidden min-h-screen flex flex-col">
    <!-- Topbar -->
    <header class="sticky top-0 z-20 bg-[#202B3A]/95 backdrop-blur border-b border-slate-800">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="font-bold tracking-wide text-lg text-[#D4B16A]">MADALUX</span>
          <span id="session-user" class="hidden md:inline-block text-xs text-slate-400 truncate max-w-[240px]"></span>
          <span id="sync-status" class="text-[11px] text-emerald-400/80">Sincronizado</span>
        </div>

        <nav class="flex items-center gap-1.5 text-xs sm:text-sm">
          <button onclick="navigate('dashboard')" data-nav="dashboard"
            class="nav-btn px-3 py-1.5 rounded-lg bg-[#087F5B] text-white font-medium cursor-pointer">
            Dashboard
          </button>
          <button onclick="navigate('lancamentos')" data-nav="lancamentos"
            class="nav-btn px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 cursor-pointer">
            Lançamentos
          </button>
          <button onclick="navigate('metas')" data-nav="metas"
            class="nav-btn px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 cursor-pointer">
            Metas
          </button>
          <button id="nav-admin" onclick="navigate('admin')" data-nav="admin"
            class="nav-btn hidden px-3 py-1.5 rounded-lg text-[#D4B16A] hover:bg-slate-800 cursor-pointer">
            Admin
          </button>
        </nav>

        <div class="flex items-center gap-2">
          <button onclick="togglePrivacy()" title="Ocultar/Mostrar valores"
            class="px-2.5 py-1.5 rounded-lg bg-[#101C2C] border border-slate-700 text-xs text-slate-300 hover:border-[#D4B16A] cursor-pointer">
            <span id="privacy-label">Visível</span>
          </button>
          <button onclick="signOutApp()"
            class="px-3 py-1.5 rounded-lg bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 text-xs font-medium cursor-pointer">
            Sair
          </button>
        </div>
      </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main id="main-content" class="flex-1 max-w-6xl w-full mx-auto px-4 py-6"></main>
  </section>

  <script>
    // =========================================================================
    // 1. CONFIGURAÇÃO DO SUPABASE (Substitua pelos dados do seu projeto)
    // =========================================================================
    const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA-ANON-KEY-AQUI';
    const ADMIN_EMAIL = 'lucasgabriel.leite3@gmail.com';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================================
    // 2. ESTADO GLOBAL
    // =========================================================================
    let currentUser = null;
    let currentProfile = null;
    let privacyHidden = false;
    let activeRoute = 'dashboard';
    let charts = [];

    let state = {
      balance: 0,
      income: 0,
      expense: 0,
      transactions: [],
      goals: []
    };

    const CATEGORIES = [
      'Salário / Renda',
      'Investimentos',
      'Moradia',
      'Alimentação',
      'Transporte',
      'Saúde & Bem-estar',
      'Educação',
      'Lazer',
      'Casamento / Eventos',
      'Outros'
    ];

    const brl = (val) => {
      if (privacyHidden) return 'R$ •••••';
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const escapeHtml = (str) => String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    // =========================================================================
    // 3. AUTENTICAÇÃO
    // =========================================================================
    function showFeedback(message, isError = true) {
      const el = document.getElementById('auth-feedback');
      el.textContent = message;
      el.className = isError
        ? 'mb-4 p-3 rounded-xl text-xs bg-rose-500/15 border border-rose-500/40 text-rose-200'
        : 'mb-4 p-3 rounded-xl text-xs bg-emerald-500/15 border border-emerald-500/40 text-emerald-200';
      el.classList.remove('hidden');
    }

    function hideFeedback() {
      const el = document.getElementById('auth-feedback');
      el.classList.add('hidden');
      el.textContent = '';
    }

    function setAuthTab(tab) {
      hideFeedback();
      const login = tab === 'login';
      document.getElementById('form-login').classList.toggle('hidden', !login);
      document.getElementById('form-register').classList.toggle('hidden', login);

      document.getElementById('tab-login').className = login
        ? 'py-2 rounded-lg text-sm font-semibold bg-[#087F5B] text-white transition cursor-pointer'
        : 'py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition cursor-pointer';

      document.getElementById('tab-register').className = !login
        ? 'py-2 rounded-lg text-sm font-semibold bg-[#087F5B] text-white transition cursor-pointer'
        : 'py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition cursor-pointer';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFeedback();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-pass').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          if (error.message.includes('Invalid login credentials')) {
            throw new Error('E-mail ou senha inválidos.');
          }
          if (error.message.includes('Email not confirmed')) {
            throw new Error('E-mail ainda não confirmado. Verifique sua caixa de entrada ou desative a confirmação no Supabase.');
          }
          throw error;
        }
        await enterWorkspace(data.user);
      } catch (err) {
        showFeedback(err.message || 'Erro ao fazer login.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Acessar Madalux';
      }
    });

    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFeedback();

      const fullName = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-pass').value;
      const btn = document.getElementById('btn-register');

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } }
        });
        if (error) throw error;

        if (data.user) {
          const isAdmin = email === ADMIN_EMAIL.toLowerCase();
          await sb.from('profiles').upsert({
            id: data.user.id,
            email,
            full_name: fullName,
            role: isAdmin ? 'admin' : 'user',
            status: isAdmin ? 'approved' : 'pending'
          });
        }

        showFeedback(
          email === ADMIN_EMAIL.toLowerCase()
            ? 'Conta admin criada. Faça login agora.'
            : 'Cadastro enviado. Aguarde aprovação do administrador.',
          false
        );
        setAuthTab('login');
      } catch (err) {
        showFeedback(err.message || 'Erro ao cadastrar.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar Solicitação';
      }
    });

    async function enterWorkspace(user) {
      currentUser = user;
      const isAdminEmail = (user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();

      let { data: profile } = await sb
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

      if (!profile) {
        const created = {
          id: user.id,
          email: user.email,
          full_name: user.user_metadata?.full_name || user.email.split('@')[0],
          role: isAdminEmail ? 'admin' : 'user',
          status: isAdminEmail ? 'approved' : 'pending'
        };
        const { data: inserted } = await sb.from('profiles').upsert(created).select().single();
        profile = inserted || created;
      }

      if (!isAdminEmail && profile.status !== 'approved') {
        await sb.auth.signOut();
        throw new Error('Seu acesso está pendente de aprovação pelo administrador.');
      }

      currentProfile = profile;
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('session-user').textContent = `${profile.full_name} • ${profile.email}`;
      document.getElementById('nav-admin').classList.toggle('hidden', !isAdminEmail && profile.role !== 'admin');

      await loadUserData();
      navigate('dashboard');
    }

    async function signOutApp() {
      await sb.auth.signOut();
      destroyCharts();
      currentUser = null;
      currentProfile = null;
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('auth-view').classList.remove('hidden');
      setAuthTab('login');
    }

    // =========================================================================
    // 4. PERSISTÊNCIA NO SUPABASE (user_data)
    // =========================================================================
    async function loadUserData() {
      const { data } = await sb
        .from('user_data')
        .select('payload')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (data?.payload) {
        state = {
          balance: 0,
          income: 0,
          expense: 0,
          transactions: Array.isArray(data.payload.transactions) ? data.payload.transactions : [],
          goals: Array.isArray(data.payload.goals) ? data.payload.goals : []
        };
      }
      recalculateTotals();
    }

    async function saveUserData() {
      const syncEl = document.getElementById('sync-status');
      syncEl.textContent = 'Salvando...';
      syncEl.className = 'text-[11px] text-[#D4B16A]';

      recalculateTotals();
      const { error } = await sb
        .from('user_data')
        .upsert({ user_id: currentUser.id, payload: state });

      if (error) {
        syncEl.textContent = 'Erro ao salvar';
        syncEl.className = 'text-[11px] text-rose-400';
        console.error('Erro ao salvar user_data:', error);
      } else {
        syncEl.textContent = 'Sincronizado';
        syncEl.className = 'text-[11px] text-emerald-400/80';
      }
    }

    function recalculateTotals() {
      let inc = 0;
      let exp = 0;
      for (const tx of state.transactions) {
        const v = Number(tx.amount) || 0;
        if (tx.type === 'income') inc += v;
        else exp += v;
      }
      state.income = inc;
      state.expense = exp;
      state.balance = inc - exp;
    }

    function togglePrivacy() {
      privacyHidden = !privacyHidden;
      document.getElementById('privacy-label').textContent = privacyHidden ? 'Oculto' : 'Visível';
      navigate(activeRoute);
    }

    function destroyCharts() {
      charts.forEach((c) => {
        try { c.destroy(); } catch (_) {}
      });
      charts = [];
    }

    // =========================================================================
    // 5. NAVEGAÇÃO E TELAS
    // =========================================================================
    function navigate(route) {
      activeRoute = route;
      destroyCharts();

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isCurrent = btn.dataset.nav === route;
        btn.className = isCurrent
          ? 'nav-btn px-3 py-1.5 rounded-lg bg-[#087F5B] text-white font-medium cursor-pointer'
          : btn.dataset.nav === 'admin'
            ? 'nav-btn px-3 py-1.5 rounded-lg text-[#D4B16A] hover:bg-slate-800 cursor-pointer'
            : 'nav-btn px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 cursor-pointer';
      });

      if (route === 'dashboard') renderDashboard();
      else if (route === 'lancamentos') renderTransactions();
      else if (route === 'metas') renderGoals();
      else if (route === 'admin') renderAdmin();
    }

    // -------------------- DASHBOARD --------------------
    function renderDashboard() {
      const main = document.getElementById('main-content');
      const totalGoalsSaved = state.goals.reduce((acc, g) => acc + (Number(g.current) || 0), 0);
      const recentTx = state.transactions.slice(0, 5);

      main.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-[#202B3A] border border-[#D4B16A]/30 rounded-2xl p-5">
            <p class="text-xs text-slate-400">Saldo Consolidado</p>
            <p class="num text-2xl font-bold text-[#D4B16A] mt-1">${brl(state.balance)}</p>
          </div>
          <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
            <p class="text-xs text-slate-400">Receitas Totais</p>
            <p class="num text-2xl font-bold text-emerald-400 mt-1">${brl(state.income)}</p>
          </div>
          <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
            <p class="text-xs text-slate-400">Despesas Totais</p>
            <p class="num text-2xl font-bold text-rose-400 mt-1">${brl(state.expense)}</p>
          </div>
          <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
            <p class="text-xs text-slate-400">Acumulado em Metas</p>
            <p class="num text-2xl font-bold text-sky-400 mt-1">${brl(totalGoalsSaved)}</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
            <h2 class="text-sm font-semibold text-[#D4B16A] mb-4">Receitas vs. Despesas</h2>
            <div class="h-64">
              <canvas id="chart-flow"></canvas>
            </div>
          </div>

          <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
            <h2 class="text-sm font-semibold text-[#D4B16A] mb-4">Despesas por Categoria</h2>
            <div class="h-64 flex items-center justify-center">
              <canvas id="chart-cat"></canvas>
            </div>
          </div>
        </div>

        <div class="bg-[#202B3A] border border-slate-700/80 rounded-2xl p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-white">Últimos Lançamentos</h2>
            <button onclick="navigate('lancamentos')" class="text-xs text-[#D4B16A] hover:underline cursor-pointer">
              Ver todos
            </button>
          </div>
          <div class="space-y-2">
            ${
              recentTx.length
                ? recentTx.map((t) => `
                  <div class="flex items-center justify-between py-2.5 px-3.5 rounded-xl bg-[#101C2C] text-sm">
                    <div>
                      <p class="font-medium text-slate-200">${escapeHtml(t.description)}</p>
                      <p class="text-[11px] text-slate-400">${escapeHtml(t.category \vert{}\vert{} 'Geral')} •${new Date(t.date).toLocaleDateString('pt-BR')}</p>
                    </div>
                    <span class="num font-semibold ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                      ${t.type === 'income' ? '+' : '-'}${brl(t.amount)}
                    </span>
                  </div>
                `).join('')
                : '<p class="text-xs text-slate-400">Nenhum lançamento registrado ainda.</p>'
            }
          </div>
        </div>
      `;

      // Gráfico 1: Barras Receitas x Despesas
      const ctx1 = document.getElementById('chart-flow');
      if (ctx1) {
        charts.push(new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: ['Receitas', 'Despesas', 'Saldo'],
            datasets: [{
              label: 'Valores (R$)',
              data: [state.income, state.expense, Math.max(state.balance, 0)],
              backgroundColor: ['#10B981', '#F43F5E', '#D4B16A'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#94A3B8' }, grid: { display: false } },
              y: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(148,163,184,0.1)' } }
            }
          }
        }));
      }

      // Gráfico 2: Rosca Despesas por Categoria
      const ctx2 = document.getElementById('chart-cat');
      if (ctx2) {
        const byCat = {};
        state.transactions
          .filter((t) => t.type === 'expense')
          .forEach((t) => {
            const cat = t.category || 'Outros';
            byCat[cat] = (byCat[cat] || 0) + (Number(t.amount) || 0);
          });

        const labels = Object.keys(byCat);
        const values = Object.values(byCat);

        charts.push(new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['Sem despesas'],
            datasets: [{
              data: values.length ? values : [1],
              backgroundColor: values.length
                ? ['#D4B16A', '#087F5B', '#38BDF8', '#F43F5E', '#A78BFA', '#FB923C', '#94A3B8']
                : ['#334155'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: { color: '#CBD5E1', boxWidth: 12, font: { size: 11 } }
              }
            }
          }
        }));
      }
    }

    // -------------------- LANÇAMENTOS --------------------
    function renderTransactions(filterType = 'all') {
      const main = document.getElementById
