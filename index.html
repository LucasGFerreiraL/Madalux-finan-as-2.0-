async function auth(reg){const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value;
if(reg){if(p.length<8)return toast('Senha com no mínimo 8 caracteres.');const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:$('#an').value.trim()}}});if(error)return toast(error.message);if(!data.session){mode='login';render();return toast('Confirme seu e-mail para concluir o cadastro e depois entre.')}}
else{const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return toast('E-mail ou senha incorretos.')}
tab='dashboard';await boot()}
async function boot(){booting=true;render();PROFILE=null;DATA=null;const{data:{session}}=await sb.auth.getSession();
if(session){const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();PROFILE=data;
if(PROFILE?.status==='approved'){const r=await sb.from('user_data').select('data').eq('user_id',PROFILE.id).maybeSingle();DATA=r.data?.data||null;D();if(!r.data)pushData();loadRates();if(PROFILE.role==='admin')await loadAdmin()}}
booting=false;render()}
async function logout(){await sb.auth.signOut();PROFILE=null;DATA=null;USERS=[];mode='login';render()}
const pend=()=>USERS.filter(u=>u.role!=='admin'&&u.status==='pending').length;
async function loadAdmin(){const b=pend(),[u,l]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('admin_actions').select('*').order('created_at',{ascending:false}).limit(8)]);USERS=u.data||[];LOG=l.data||[];if(booting)return;if(tab==='approvals')view();else if(b!==pend())render()}
async function setStatus(id,s){const u=USERS.find(x=>x.id===id);if(!confirm(`${s==='approved'?'Aprovar':'Recusar'} o acesso de ${u.name||u.email}?`))return;const{error}=await sb.rpc('set_user_status',{target:id,new_status:s});if(error)return toast(error.message);toast(s==='approved'?'Acesso aprovado com sucesso.':'Solicitação recusada.');await loadAdmin();render()}
function userInfo(id){const u=USERS.find(x=>x.id===id),r=(k,v)=>`<div class="flex justify-between gap-4 text-sm"><span class="text-slate-400">${k}</span><span class="text-right break-all">${v}</span></div>`;
modal('Detalhes da conta',r('Nome',esc(u.name||'—'))+r('E-mail',esc(u.email))+r('Cadastro',new Date(u.created_at).toLocaleString('pt-BR'))+r('Status',({pending:'Pendente',approved:'Aprovado',rejected:'Recusado'})[u.status])+r('Revisado em',u.reviewed_at?new Date(u.reviewed_at).toLocaleString('pt-BR'):'—')+r('ID',`<code class="text-xs">${esc(u.id.slice(0,8))}…</code>`),'closeModal()')}

`<div class="${C.card} overflow-x-auto">${tx.length?`<table class="w-full text-sm text-left"><thead class="text-xs text-slate-400"><tr><th class="pb-3">Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th class="text-right">Valor</th><th></th></tr></thead><tbody class="divide-y divide-slate-200 dark:divide-slate-800">${tx.map(t=>`<tr><td class="py-3 pr-3 whitespace-nowrap text-slate-400">${fdate(t.date)}</td><td class="pr-3">${esc(t.description)}</td><td class="pr-3 text-slate-400 whitespace-nowrap">${ic(CI[t.category]||'circle-ellipsis','mr-1.5 text-gold')}${esc(t.category)}</td><td class="pr-3 text-slate-400">${esc(accName(t.accountId))}</td><td class="text-right font-bold whitespace-nowrap fv ${t.type==='income'?'text-emerald-500':'text-red-500'}">${t.type==='income'?'+':'-'} ${brl(t.amount)}</td><td class="text-right whitespace-nowrap">${ib('openTx',t.id,ic('pencil'))}${ib('delTx',t.id,ic('trash-2'))}</td></tr>`).join('')}</tbody></table>`:'<p class="text-center text-sm text-slate-400 py-10">Nenhum lançamento neste período.</p>'}</div>`},

approvals(){if(me().role!=='admin')return head('Acesso restrito','Área exclusiva do administrador');
const rows=USERS.filter(u=>u.role!=='admin'),list=rows.filter(u=>uf==='all'||u.status===uf),cnt=s=>rows.filter(u=>u.status===s).length,
bd={pending:['Pendente','text-gold border-gold/40 bg-gold/10'],approved:['Aprovado','text-emerald-500 border-emerald/40 bg-emerald/10'],rejected:['Recusado','text-red-400 border-red-500/40 bg-red-500/10']},

`<div class="flex flex-wrap gap-2 mb-4">${fl.map(([k,l])=>`<button onclick="uf='${k}';view()" class="px-3 py-1.5 rounded-xl text-xs border ${uf===k?'border-gold text-gold bg-gold/10':'border-slate-400/30 text-slate-400'}">${l}${k==='all'?'':' ('+cnt(k)+')'}</button>`).join('')}</div>

${LOG.length?`<div class="${C.card} mt-4"><h4 class="text-sm font-bold mb-3">${ic('history','mr-1 text-gold')} Histórico de ações</h4><ul class="space-y-1.5 text-xs text-slate-400">${LOG.map(l=>`<li>${new Date(l.created_at).toLocaleString('pt-BR')} — ${l.action==='approved'?'Aprovado':'Recusado'}: ${esc(l.target_email)}</li>`).join('')}</ul></div>`:''}`},

/* ---------- CRUD ---------- */
function openTx(id=''){const d=D();if(!d.accounts.length){toast('Cadastre uma conta antes de lançar.');return go('accounts')}
const t=d.transactions.find(x=>x.id===id)||{type:'expense',description:'',amount:'',category:'',date:today(),accountId:d.accounts[0].id};
modal(id?'Editar lançamento':'Novo lançamento',sel('Tipo','tt',[['expense','Despesa'],['income','Receita']],t.type)+fld('Descrição','td','text',t.description,'required')+fld('Valor (R$)','ta','number',t.amount,'required step=0.01 min=0.01')+`<label class="block"><span class="text-xs text-slate-400">Categoria</span><input id="tc" list="cl" value="${esc(t.category)}" required class="${C.inp}"><datalist id="cl">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist></label>`+fld('Data','tdt','date',t.date,'required')+sel('Conta','tac',d.accounts.map(a=>[a.id,a.name]),t.accountId),`saveTx('${id}')`)}
function saveTx(id){const o={type:$('#tt').value,description:$('#td').value.trim(),amount:parseFloat($('#ta').value),category:$('#tc').value.trim(),date:$('#tdt').value,accountId:$('#tac').value};if(!(o.amount>0))return toast('Informe um valor válido.');
const l=D().transactions,i=l.findIndex(x=>x.id===id);if(i>=0)l[i]={...l[i],...o};else l.push({id:uid('t'),...o});save();closeModal();view();toast('Lançamento salvo.')}
function delTx(id){if(!confirm('Excluir este lançamento?'))return;D().transactions=D().transactions.filter(t=>t.id!==id);save();view()}
function openAcc(id=''){const a=D().accounts.find(x=>x.id===id)||{name:'',institution:'',type:'Corrente',initial:''};
modal(id?'Editar conta':'Nova conta',fld('Nome da conta','an2','text',a.name,'required')+fld('Instituição','ai','text',a.institution,'required')+sel('Tipo','at',['Corrente','Poupança','Investimento','Carteira'].map(x=>[x,x]),a.type)+fld('Saldo inicial (R$)','ab','number',a.initial,'required step=0.01'),`saveAcc('${id}')`)}
function saveAcc(id){const o={name:$('#an2').value.trim(),institution:$('#ai').value.trim(),type:$('#at').value,initial:parseFloat($('#ab').value)||0},l=D().accounts,i=l.findIndex(x=>x.id===id);if(i>=0)l[i]={...l[i],...o};else l.push({id:uid('a'),...o});save();closeModal();view();toast('Conta salva.')}
function delAcc(id){const n=D().transactions.filter(t=>t.accountId===id).length;if(!confirm(n?`Excluir a conta e seus ${n} lançamentos?`:'Excluir esta conta?'))return;D().accounts=D().accounts.filter(a=>a.id!==id);D().transactions=D().transactions.filter(t=>t.accountId!==id);save();view()}
function openGoal(id=''){const g=D().goals.find(x=>x.id===id)||{title:'',target:'',current:0,deadline:today()};
modal(id?'Editar meta':'Nova meta',fld('Título','gt','text',g.title,'required')+fld('Valor da meta (R$)','gm','number',g.target,'required step=0.01 min=1')+fld('Acumulado (R$)','gc','number',g.current,'required step=0.01 min=0')+fld('Prazo','gd','date',g.deadline,'required'),`saveGoal('${id}')`)}
function saveGoal(id){const o={title:$('#gt').value.trim(),target:parseFloat($('#gm').value),current:parseFloat($('#gc').value)||0,deadline:$('#gd').value},l=D().goals,i=l.findIndex(x=>x.id===id);if(i>=0)l[i]={...l[i],...o};else l.push({id:uid('g'),...o});save();closeModal();view()}
function delGoal(id){if(confirm('Excluir esta meta?')){D().goals=D().goals.filter(g=>g.id!==id);save();view()}}

/* ---------- Exportação / backup ---------- */
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function exportCsv(){const q=s=>{s=String(s);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};const r=[['Data','Tipo','Descrição','Categoria','Conta','Valor'],...monthTx().map(t=>[fdate(t.date),t.type==='income'?'Receita':'Despesa',t.description,t.category,accName(t.accountId),t.amount.toFixed(2).replace('.',',')])];dl(`madalux-${month}.csv`,'\ufeff'+r.map(x=>x.map(q).join(';')).join('\n'),'text/csv')}
function exportBackup(){dl(`madalux-backup-${today()}.json`,JSON.stringify(D()),'application/json')}
function importBackup(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.accounts)||!Array.isArray(o.transactions)||!Array.isArray(o.goals))throw 0;if(!confirm('Isso substituirá seus dados atuais. Continuar?'))return;DATA=o;save();view();toast('Backup restaurado.')}catch{toast('Arquivo de backup inválido.')}};r.readAsText(f)}
function clearData(){if(confirm('Apagar TODAS as suas contas, lançamentos e metas?')){DATA=defaults();save();view();toast('Dados apagados.')}}

/* ---------- Mercado ---------- */
async function loadRates(){try{const[a,b]=await Promise.all([fetch('https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL,BTC-BRL').then(r=>r.json()),fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json').then(r=>r.json())]);rates={usd:a.USDBRL,eur:a.EURBRL,btc:a.BTCBRL,selic:parseFloat(b[0].valor),at:new Date()}}catch{rates={err:1,selic:rates?.selic}}if(tab==='market'&&me())view()}

/* ---------- Assistente ---------- */
function num(t){const m=t.match(/\d[\d.,]*/);if(!m)return NaN;let s=m[0].replace(/[.,]+$/,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
const guess=(l,ty)=>/almo|jant|mercado|restaur|lanche|ifood|padaria|caf[eé]/.test(l)?'Alimentação':/uber|gasolina|combust|[oô]nibus|metr[oô]/.test(l)?'Transporte':/aluguel|condom|\bluz\b|[aá]gua|internet/.test(l)?'Moradia':/farm|m[eé]dic|consulta|exame/.test(l)?'Saúde':/sal[aá]rio/.test(l)?'Salário':ty==='income'?'Renda Extra':'Outros';
function reply(txt){const l=txt.toLowerCase(),v=num(txt),d=D(),
ty=/gast|pagu|comprei|despesa/.test(l)?'expense':/receb|ganhei|sal[aá]rio|freela|vendi/.test(l)?'income':null,bot=t=>[{r:'bot',t}];
if(ty&&v>0){if(!d.accounts.length)return bot('Cadastre uma conta primeiro (menu <b>Contas</b>) para eu poder registrar lançamentos.');
let ds=txt.replace(/r\$\s*/i,'').replace(/\d[\d.,]*/,'').replace(/^\s*(gastei|paguei|comprei|recebi|ganhei)\s*/i,'').replace(/^(de|no|na|em|com)\s+/i,'').replace(/\s+/g,' ').trim();
pending={id:uid('t'),type:ty,amount:v,description:ds?ds[0].toUpperCase()+ds.slice(1):'Lançamento',category:guess(l,ty),date:today(),accountId:d.accounts[0].id};
return[...bot(`Identifiquei ${ty==='income'?'uma receita':'uma despesa'}. Confirme os dados:`),{r:'card',d:pending}]}
if(/guard|poup|investi|aporte/.test(l)&&v>0){const n=l.match(/(\d+)\s*(ano|m[eê]s)/),m=n?+n[1]*(n[2]==='ano'?12:1):12,r=(rates?.selic??10.5)/100,i=Math.pow(1+r,1/12)-1,fv=v*((Math.pow(1+i,m)-1)/i);
return bot(`Aportando <b>${brl(v)}</b> por mês durante ${m} meses a ${(r*100).toFixed(2).replace('.',',')}% a.a. (${rates?.selic!=null?'Selic atual':'taxa estimada'}), você teria cerca de <b>${brl(fv)}</b> (valor bruto, antes de impostos). Total aportado: ${brl(v*m)}.`)}
if(/saldo|quanto tenho|patrim/.test(l))return bot(`Seu saldo somado nas contas é <b>${brl(d.accounts.reduce((s,a)=>s+bal(a),0))}</b>.`);
if(/resumo|m[eê]s/.test(l)){const t=monthTx(),i=sum(t,'income'),e=sum(t,'expense');return bot(`Em ${month.split('-').reverse().join('/')}: receitas <b>${brl(i)}</b>, despesas <b>${brl(e)}</b>, resultado <b>${brl(i-e)}</b>.`)}
return bot('Posso registrar lançamentos (“gastei 45 no almoço”), simular aportes (“guardar 1000 por mês por 2 anos”) e informar seu saldo ou o resumo do mês.')}
function send(t){const i=$('#ci');t=(t??i.value).trim();if(!t)return;chat.forEach(c=>{if(c.r==='card')c.d=null});pending=null;chat.push({r:'me',t:esc(t)},...reply(t));view()}
function okTx(){if(!pending)return;D().transactions.push(pending);pending=null;chat.forEach(c=>{if(c.r==='card')c.d=null});chat.push({r:'bot',t:'Lançamento registrado com sucesso. Você pode editá-lo em <b>Lançamentos</b>.'});save();view()}
function noTx(){pending=null;chat.forEach(c=>{if(c.r==='card')c.d=null});chat.push({r:'bot',t:'Operação cancelada.'});view()}

setInterval(()=>{if(PROFILE?.role==='admin'&&PROFILE.status==='approved')loadAdmin()},30000);if(CONFIGURED)boot();else render();
</script>
